# Wizard tugas backup ke NAS lain (ADR 0019): satu shared folder ke NAS
# tujuan yang sudah dipasangkan, setiap hari.
id: backup-remote-create
action: rbackup.job_create
admin_only: true
title:
  id: Backup ke NAS lain
  en: Back up to another NAS
finish_label:
  id: Buat tugas
  en: Create task

steps:
  - id: source
    title: { id: Folder yang di-backup, en: Folder to back up }
    description:
      id: >-
        Salinan dikirim lewat HTTPS ke NAS tujuan setiap hari: pertama
        semuanya, berikutnya hanya bagian yang berubah. Jumlah salinan yang
        disimpan diatur di NAS tujuan.
      en: >-
        Copies are sent over HTTPS to the destination NAS every day: first
        everything, then only what changed. How many copies are kept is set
        on the destination NAS.
    fields:
      - key: share
        type: share-select
        required: true
        label: { id: Shared folder, en: Shared folder }
      - key: target
        type: target-select
        required: true
        label: { id: NAS tujuan, en: Destination NAS }

  - id: schedule
    title: { id: Jadwal, en: Schedule }
    fields:
      - key: hour
        type: text
        required: true
        default: "1"
        pattern: "^([01]?[0-9]|2[0-3])$"
        autocomplete: "off"
        label: { id: Jam backup setiap hari (0–23, waktu NAS), en: Daily backup hour (0–23, NAS time) }

  - id: summary
    type: review
    title: { id: Ringkasan, en: Summary }
    fields:
      - key: admin_password
        type: current-password
        required: true
        secret: true
        autocomplete: current-password
        label: { id: Password Anda, en: Your password }

# Data repo APT Sapo (dibaca build-repo.sh, build.sh paket .deb, dan workflow
# rilis). Repo di-hosting GitHub Pages dari cabang gh-pages (folder apt/).
REPO_URL=https://mehuli-id.github.io/sapo/apt
ORIGIN="Sapo by Mehuli"
LABEL=Sapo
# Saluran: stable dari rilis bertag (v*), dev dari main (dijalankan manual).
# Semua saluran selalu diterbitkan dan ditandatangani, walau kosong.
CHANNELS="stable dev"
COMPONENT=main
ARCHS="amd64 arm64"
# Versi lama yang disimpan per saluran (yang lebih lama dihapus dari pool).
KEEP_VERSIONS=5
# Kunci penanda tangan (kunci publik: sapo-archive-key.asc di folder ini).
KEY_FINGERPRINT=237976216EBA1A736DF6C54D40BBEB6FC1DC81B4
# Lokasi di NAS: kunci publik (biner) dan sumber APT (deb822), dipasang
# paket sapo agar NAS bisa update lewat apt.
KEYRING=/usr/share/keyrings/sapo-archive-keyring.gpg
SOURCES=/etc/apt/sources.list.d/sapo.sources
DEFAULT_CHANNEL=stable

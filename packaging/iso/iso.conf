# Data ISO live Sapo (dibaca build.sh). Dua jenis (FLAVOR):
# - dev: dibangun di setiap push ke main, untuk pengembang dan penguji; ada
#   akun debug "user" (sudo) di konsol.
# - release: dari tag v* (workflow Rilis), dilampirkan ke GitHub Release;
#   tanpa akun debug.
# Keduanya berjalan dari RAM dan bisa dipasang ke disk lewat Storage Manager
# (ADR 0016).
ISO_NAME_dev=sapo-dev
ISO_VOLUME_dev=SAPO_DEV
ISO_APPLICATION_dev="Sapo by Mehuli (dev)"
ISO_ISSUE_dev="Sapo by Mehuli (ISO dev, berjalan dari RAM; semua perubahan hilang saat dimatikan)"
ISO_NAME_release=sapo
ISO_VOLUME_release=SAPO
ISO_APPLICATION_release="Sapo by Mehuli"
ISO_ISSUE_release="Sapo by Mehuli (berjalan dari USB/CD; pasang ke disk lewat Storage Manager di panel)"
ARCH=amd64
DISTRIBUTION=trixie
# contrib: zfs-dkms (lisensi CDDL, dikompilasi di dalam ISO; ADR 0001/0005).
# non-free-firmware: firmware kartu jaringan dan microcode CPU untuk
# komputer sungguhan.
ARCHIVE_AREAS="main contrib non-free-firmware"
MIRROR=http://deb.debian.org/debian
ISO_PUBLISHER="PT. Mehuli Data Media; https://github.com/mehuli-id/sapo"
# Parameter boot live: nama host (panel di http://sapo.local:5000), tanpa
# autologin agar layar konsol menampilkan alamat panel (/etc/issue.d), dan
# log ke port serial juga (dibaca uji asap di CI). Layar utama tetap tty0.
# overlay.*: akar sistem live (overlayfs) harus bisa diekspor NFS, karena
# NFSv4 menelusuri folder dari akar semu "/" (ADR 0007).
BOOT_APPEND="boot=live components live-config.hostname=sapo live-config.noautologin overlay.index=Y overlay.nfs_export=Y console=ttyS0,115200 console=tty0 quiet"
# Menu boot memilih entri pertama sendiri setelah jeda ini (detik). Bawaan
# live-build menunggu tanpa batas, sehingga boot tanpa keyboard macet.
BOOT_TIMEOUT_S=5
# Direktori kerja live-build (dibuat ulang setiap build).
WORK_DIR=build/iso

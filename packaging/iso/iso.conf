# Data ISO live dev (dibaca build.sh). ISO ini untuk pengembang dan penguji:
# berjalan dari RAM, tidak memasang apa pun ke disk, dan semua isinya hilang
# saat dimatikan. Installer ke disk adalah Fase 3.
ISO_NAME=sapo-dev
ARCH=amd64
DISTRIBUTION=trixie
ARCHIVE_AREAS="main"
MIRROR=http://deb.debian.org/debian
ISO_VOLUME=SAPO_DEV
ISO_APPLICATION="Sapo by Mehuli (dev)"
ISO_PUBLISHER="PT. Mehuli Data Media; https://github.com/mehuli-id/sapo"
# Parameter boot live: nama host (panel di http://sapo.local:5000), tanpa
# autologin agar layar konsol menampilkan alamat panel (/etc/issue.d), dan
# log ke port serial juga (dibaca uji asap di CI). Layar utama tetap tty0.
BOOT_APPEND="boot=live components live-config.hostname=sapo live-config.noautologin console=ttyS0,115200 console=tty0 quiet"
# Direktori kerja live-build (dibuat ulang setiap build).
WORK_DIR=build/iso

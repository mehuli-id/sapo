# Data paket .deb (dibaca build.sh). Ganti alamat maintainer dengan alamat
# email resmi sebelum rilis publik.
MAINTAINER_EMAIL=maintainer@mehuli.id
# Lokasi pemasangan.
PREFIX_BIN=/usr/lib/sapo
PREFIX_SHARE=/usr/share/sapo
CONF_DIR=/etc/sapo
UNIT_DIR=/usr/lib/systemd/system
SYSUSERS_DIR=/usr/lib/sysusers.d
# File alamat panel untuk layar konsol, ditulis sapod (sama dengan
# agent.console.issue_file di config/sapo.yaml).
CONSOLE_ISSUE=/run/sapo/console.issue

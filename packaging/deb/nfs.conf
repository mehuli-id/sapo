# Dari paket sapo: server NFS hanya melayani NFS versi 4 lewat TCP (satu
# port, 2049). NFS versi 2 dan 3 butuh rpcbind dan mountd di jaringan dan
# tidak dipakai Sapo (docs/adr/0007-nfs.md). Ekspor diatur lewat panel.
# rpcbind dimatikan (mask) oleh postinst paket sapo. Port mountd dipatok
# agar uji asap bisa memastikan mountd tidak terbuka di jaringan.
[nfsd]
vers2=n
vers3=n
udp=n
[mountd]
port=20048

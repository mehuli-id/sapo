name: ISO dev

# ISO live untuk pengembang dan penguji (packaging/iso/). Dibangun di setiap
# push ke main, di pull request yang mengubah pengemasan, atau manual dari tab
# Actions. Setiap ISO di-boot di QEMU dan baru diunggah bila panel menjawab.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - packaging/**
      - .github/workflows/iso.yml
  workflow_dispatch:

permissions:
  contents: read

# Build lama untuk cabang yang sama dibatalkan bila ada commit baru.
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: stable
  # Lingkungan build ISO: Debian yang sama dengan isi ISO (iso.conf).
  BUILD_IMAGE: debian:trixie
  # Artifact ISO cukup besar; simpan sebentar saja.
  RETENTION_DAYS: 14

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # versi paket diambil dari tag git
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build .deb
        run: |
          source packaging/iso/iso.conf
          make deb ARCH="$ARCH"
      - name: build ISO (live-build di container Debian)
        run: |
          # live-build butuh chroot dan mount, jadi container harus privileged.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          docker run --rm --privileged -e SOURCE_DATE_EPOCH \
            -e OWNER="$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src "$BUILD_IMAGE" bash -euc '
              apt-get update -qq
              apt-get install -y -qq live-build ca-certificates >/dev/null
              packaging/iso/build.sh
              chown -R "$OWNER" dist'
          ls -lh dist/
      - name: aktifkan KVM untuk uji boot
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 smbclient nfs-common exfatprogs >/dev/null
      - name: uji boot (panel harus menjawab)
        run: packaging/iso/smoke-test.sh dist/*.iso
      - name: log konsol VM
        if: always()
        run: |
          echo "--- baris NFS/overlay ---"
          grep -aiE 'nfs|mountd|exportfs|overlay|rpcbind' dist/smoke-test-console.log | tail -n 60 || true
          echo "--- 200 baris terakhir ---"
          tail -n 200 dist/smoke-test-console.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sapo-iso-dev
          path: |
            dist/*.iso
            dist/*.iso.sha256
          retention-days: ${{ env.RETENTION_DAYS }}
          # ISO sudah terkompresi (squashfs).
          compression-level: 0

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Action pihak ketiga dikunci ke commit SHA (komentar = tag saat dikunci).
# Pembaruan diusulkan otomatis oleh Dependabot (.github/dependabot.yml).
env:
  # Paket rilis dibangun dengan rilis Go stabil terbaru (masih didukung dan
  # mendapat perbaikan keamanan); go.mod hanya menyatakan versi minimal.
  GO_VERSION: stable
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal tools)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: vendor sama dengan modul upstream (checksum database Go)
        run: |
          # go.sum dibuat dari checksum database resmi, lalu vendor/ dibuat
          # ulang dari modul yang sudah diverifikasi dan dibandingkan dengan
          # isi repo. Perbedaan apa pun = vendor/ tidak asli.
          GOFLAGS=-mod=mod go mod tidy
          go mod verify
          go mod vendor
          git diff --exit-code -- vendor go.mod
      - name: govulncheck (termasuk standard library)
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
      - name: build
        run: make go

  # Wi-Fi sungguhan (ADR 0023): radio virtual kernel, titik akses hostapd
  # WPA2 dan WPA3, stasiun memakai file wpa_supplicant buatan sapod.
  wifi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: radio virtual, hostapd, wpa_supplicant, iw
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends hostapd wpasupplicant iw "linux-modules-extra-$(uname -r)" >/dev/null
          sudo systemctl stop wpa_supplicant 2>/dev/null || true
      - name: uji Wi-Fi
        run: tools/wifi-hwsim/run.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  deb:
    needs: [go, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # versi paket diambil dari tag git
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build .deb
        run: make deb ARCH=${{ matrix.arch }}
      - name: cek isi paket
        run: dpkg-deb -I dist/*.deb && dpkg-deb -c dist/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sapo-deb-${{ matrix.arch }}
          path: dist/*.deb

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (versi mayor) gagal di CI (PR #6); tunda sampai panel siap.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

id: app-center
name: { id: App Center, en: App Center }
group: apps
# Podman dari Debian (ADR 0012): tanpa daemon root; aplikasi dijalankan
# systemd lewat Quadlet.
packages: [podman]
services: []
requires: [core]
# always: selalu terpasang · setup: dipilih saat instalasi · optional: diaktifkan dari panel
activation: optional
removable: true
